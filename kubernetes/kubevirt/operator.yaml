# KubeVirt Operator Deployment (Simplified for infra-as-code reference)
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt
---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      useEmulation: true # Useful for development environments without nested virtualization
